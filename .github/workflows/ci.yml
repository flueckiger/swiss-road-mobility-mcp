name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Bringt den ruff-Pin aus dem [dev]-Extra mit. Hier stand danach ein
        # zweiter `pip install ruff==<version>`-Schritt, der nach diesem lief
        # und gegen pyproject gewann: den Pin dort zu aendern haette in der CI
        # nichts bewirkt. Die Version steht nur noch in pyproject, damit
        # lokaler Lauf und Gate sich nicht ueber sie uneinig sein koennen.
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax check
        run: python -m py_compile src/swiss_road_mobility_mcp/server.py

      - name: Import test
        run: python -c "from swiss_road_mobility_mcp.server import mcp; print('Import OK')"

      - name: Unit tests (mocked, no live APIs)
        run: pytest -m "not live"

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
